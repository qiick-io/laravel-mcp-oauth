name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} Laravel ${{ matrix.laravel }} ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'
        laravel:
          - '12'
          - '13'
        dependency-version:
          - lowest
          - stable
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: intl, openssl, pdo_sqlite
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: |
          # illuminate floor 12.41.1 matches laravel/mcp 1.2.1 (design §2 / §10).
          if [ "${{ matrix.laravel }}" = "12" ]; then
            ILLUMINATE='^12.41.1'
          else
            ILLUMINATE='^13.0'
          fi
          composer require --dev --no-interaction --no-update "orchestra/testbench:^${{ matrix.testbench }}.0"
          composer require --no-interaction --no-update \
            "illuminate/console:${ILLUMINATE}" \
            "illuminate/contracts:${ILLUMINATE}" \
            "illuminate/database:${ILLUMINATE}" \
            "illuminate/http:${ILLUMINATE}" \
            "illuminate/routing:${ILLUMINATE}" \
            "illuminate/support:${ILLUMINATE}"
          if [ "${{ matrix.dependency-version }}" = "lowest" ]; then
            composer update --no-interaction --prefer-dist --prefer-lowest --with-all-dependencies
          else
            composer update --no-interaction --prefer-dist --with-all-dependencies
          fi

      - name: Composer audit
        run: composer audit --no-interaction

      # Static analysis depends on the tool versions, not on the runtime floor:
      # with --prefer-lowest, old polyfills redefine core functions without types.
      - name: Pint
        if: matrix.dependency-version == 'stable'
        run: vendor/bin/pint --test

      - name: PHPStan
        if: matrix.dependency-version == 'stable'
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # Level max with no baseline: the ratchet fails if a baseline ever appears.
      - name: Larastan baseline only shrinks
        run: node scripts/qiick-ratchet.mjs phpstan --min-level max

      - name: Pest
        run: vendor/bin/pest

  # Mutation targets from the design §11.4: one pest --mutate invocation per
  # class (pcov, no --covered-only, no || true), split round-robin across
  # parallel shards so no job runs near its timeout. The longest shard takes
  # about 16 minutes; add a shard (and update MUTATE_SHARDS) before one passes
  # 20. Locked dependencies, so every shard mutates against the same versions.
  mutation-shards:
    name: Mutation (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          # pest --mutate needs a coverage driver.
          coverage: pcov
          extensions: intl, openssl, pdo_sqlite
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Pest mutate (security-critical classes, per-class min 95)
        env:
          MUTATE_SHARD: ${{ matrix.shard }}
          MUTATE_SHARDS: 4
        run: bash scripts/mutate-per-class.sh

  # One stable check name over every shard, for branch protection: it fails
  # unless every shard succeeded (a cancelled or skipped shard fails it too).
  mutation:
    name: Mutation
    needs: mutation-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: test "${{ needs.mutation-shards.result }}" = "success"

  # Real HTTP against php -S. Feature PRs fill the Pest `http` group; once any
  # test joins that group the job must fail if the group is empty.
  http-server:
    name: Real HTTP (Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          extensions: intl, openssl, pdo_sqlite
          tools: composer:v2

      - name: Install dependencies
        run: |
          if [ "${{ matrix.laravel }}" = "12" ]; then
            ILLUMINATE='^12.41.1'
          else
            ILLUMINATE='^13.0'
          fi
          composer require --dev --no-interaction --no-update "orchestra/testbench:^${{ matrix.testbench }}.0"
          composer require --no-interaction --no-update \
            "illuminate/console:${ILLUMINATE}" \
            "illuminate/contracts:${ILLUMINATE}" \
            "illuminate/database:${ILLUMINATE}" \
            "illuminate/http:${ILLUMINATE}" \
            "illuminate/routing:${ILLUMINATE}" \
            "illuminate/support:${ILLUMINATE}"
          composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pest (real HTTP group)
        run: |
          if vendor/bin/pest --list-tests 2>/dev/null | grep -qE '\(http\)|/Http/'; then
            count="$(vendor/bin/pest --list-tests --group=http 2>/dev/null | grep -c . || true)"
            if [ "${count}" -eq 0 ]; then
              echo "http Pest group is empty; failing as required once HTTP tests exist."
              exit 1
            fi
            vendor/bin/pest --group=http
          else
            echo "No http group yet (scaffold); feature PRs add the suite and then empty fails."
            vendor/bin/pest
          fi

  # Four engines for the whole suite (design §11.3).
  # Scaffold keeps the job shape; migration PRs wire services and DB_CONNECTION.
  # One engine per job so MySQL and MariaDB never share a runner (GHA services
  # start every declared container on every matrix cell).
  databases:
    name: Databases (${{ matrix.engine }})
    runs-on: ubuntu-latest
    # The whole suite on a server engine: MariaDB took over 10 minutes locally.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sqlite
            db_connection: sqlite
            db_port: ''
            db_database: ':memory:'
            db_username: ''
            db_password: ''
          - engine: pgsql
            db_connection: pgsql
            db_port: '5432'
            db_database: mcp_oauth_test
            db_username: postgres
            db_password: postgres
            image: postgres:16
            health: pg_isready -U postgres
            docker_env: '-e POSTGRES_DB=mcp_oauth_test -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres'
          - engine: mysql
            db_connection: mysql
            db_port: '3306'
            db_database: mcp_oauth_test
            db_username: root
            db_password: ''
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -uroot --silent
            docker_env: '-e MYSQL_DATABASE=mcp_oauth_test -e MYSQL_ALLOW_EMPTY_PASSWORD=yes'
          - engine: mariadb
            db_connection: mariadb
            db_port: '3306'
            db_database: mcp_oauth_test
            db_username: root
            db_password: ''
            image: mariadb:11.4
            health: healthcheck.sh --connect --innodb_initialized
            docker_env: '-e MYSQL_DATABASE=mcp_oauth_test -e MYSQL_ALLOW_EMPTY_PASSWORD=yes'
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start ${{ matrix.engine }}
        if: matrix.engine != 'sqlite'
        run: |
          docker run -d --name mcp-oauth-db \
            -p ${{ matrix.db_port }}:${{ matrix.db_port == '5432' && '5432' || '3306' }} \
            ${{ matrix.docker_env }} \
            ${{ matrix.image }}
          for attempt in $(seq 1 30); do
            if docker exec mcp-oauth-db ${{ matrix.health }}; then
              exit 0
            fi
            sleep 2
          done
          docker logs mcp-oauth-db
          exit 1

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          extensions: intl, openssl, pdo_sqlite, pdo_mysql, pdo_pgsql
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^11.0"
          composer require --no-interaction --no-update \
            "illuminate/console:^13.0" \
            "illuminate/contracts:^13.0" \
            "illuminate/database:^13.0" \
            "illuminate/http:^13.0" \
            "illuminate/routing:^13.0" \
            "illuminate/support:^13.0"
          composer update --no-interaction --prefer-dist --with-all-dependencies

      # The whole suite, not only the schema tests: token, refresh, revocation
      # and consent queries differ by dialect (MySQL refuses an UPDATE whose
      # subquery reads the same table, error 1093).
      - name: Pest on ${{ matrix.engine }}
        env:
          DB_CONNECTION: ${{ matrix.db_connection }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db_port }}
          DB_DATABASE: ${{ matrix.db_database }}
          DB_USERNAME: ${{ matrix.db_username }}
          DB_PASSWORD: ${{ matrix.db_password }}
        run: vendor/bin/pest

  # S81: installing without Inertia (suggest) boots; --no-dev proves that.
  no-dev-boot:
    name: No-dev boot (no Inertia)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          extensions: intl, openssl
          tools: composer:v2

      - name: Install runtime dependencies only
        run: |
          composer update --no-interaction --prefer-dist --no-dev
          php -r 'require "vendor/autoload.php"; echo class_exists("Qiick\\McpOAuth\\McpOAuthServiceProvider") ? "ok\n" : exit(1);'

  standards:
    # qiick-io/app-ui@v0.12.0
    uses: qiick-io/app-ui/.github/workflows/drift-check.yml@f613af9febfce3b6d7f7f41785e9845a610080c7 # v0.12.0
    with:
      standards: true
      registry: false

  pr-title:
    if: github.event_name == 'pull_request'
    # qiick-io/app-ui@v0.12.0
    uses: qiick-io/app-ui/.github/workflows/pr-title.yml@f613af9febfce3b6d7f7f41785e9845a610080c7 # v0.12.0
