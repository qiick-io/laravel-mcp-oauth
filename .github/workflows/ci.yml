name: CI

# The shared package matrix (app-ui docs/package-matrix.md): a pull request
# runs only what its change can break, a push to develop or main, the nightly
# run and a manual run everything. Every job always reports under its name; a
# job with nothing to do skips its steps, never itself, so a required check
# never stays pending.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    # `edited`: a new title re-runs pr-title / commitlint.
    types: [opened, edited, synchronize, reopened]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-matrix:
    # qiick-io/app-ui@v0.15.0
    uses: qiick-io/app-ui/.github/workflows/package-matrix.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0
    with:
      app-ui-ref: 0d97ae1429a856411c76e6de1ec258cae0eabab6

  tests:
    name: PHP ${{ matrix.php }} Laravel ${{ matrix.laravel }} ${{ matrix.dependency-version }}
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        if: ${{ !matrix.skip }}
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        if: ${{ !matrix.skip }}
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: intl, openssl, pdo_sqlite
          tools: composer:v2

      - name: Validate composer.json
        if: ${{ !matrix.skip }}
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        if: ${{ !matrix.skip }}
        env:
          LARAVEL_MAJOR: ${{ matrix.laravel }}
          TESTBENCH_MAJOR: ${{ matrix.testbench }}
          DEPENDENCY_VERSION: ${{ matrix.dependency-version }}
        run: |
          # illuminate floor 12.41.1 matches laravel/mcp 1.2.1 (design §2 / §10).
          if [ "${LARAVEL_MAJOR}" = "12" ]; then
            ILLUMINATE='^12.41.1'
          else
            ILLUMINATE="^${LARAVEL_MAJOR}.0"
          fi
          composer require --dev --no-interaction --no-update "orchestra/testbench:^${TESTBENCH_MAJOR}.0"
          composer require --no-interaction --no-update \
            "illuminate/console:${ILLUMINATE}" \
            "illuminate/contracts:${ILLUMINATE}" \
            "illuminate/database:${ILLUMINATE}" \
            "illuminate/http:${ILLUMINATE}" \
            "illuminate/routing:${ILLUMINATE}" \
            "illuminate/support:${ILLUMINATE}"
          if [ "${DEPENDENCY_VERSION}" = "lowest" ]; then
            composer update --no-interaction --prefer-dist --prefer-lowest --with-all-dependencies
          else
            composer update --no-interaction --prefer-dist --with-all-dependencies
          fi

      - name: Composer audit
        if: ${{ !matrix.skip }}
        run: composer audit --no-interaction

      # Static analysis depends on the tool versions, not on the runtime floor:
      # with --prefer-lowest, old polyfills redefine core functions without types.
      - name: Pint
        if: ${{ !matrix.skip && matrix.dependency-version == 'stable' }}
        run: vendor/bin/pint --test

      - name: PHPStan
        if: ${{ !matrix.skip && matrix.dependency-version == 'stable' }}
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # Level max with no baseline: the ratchet fails if a baseline ever appears.
      - name: Larastan baseline only shrinks
        if: ${{ !matrix.skip }}
        run: node scripts/qiick-ratchet.mjs phpstan --min-level max

      - name: Pest
        if: ${{ !matrix.skip }}
        run: vendor/bin/pest

  # Per-class mutation (design §11.4), at least 95 per class, split over nine
  # shards (scripts/mutate-per-class.sh): on a full run the four slowest
  # classes get a shard each and the rest share five; on a pull request only
  # the curated classes it changed run, dealt over all nine.
  mutation-shards:
    name: Mutation (shard ${{ matrix.shard }}/9)
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      - name: Checkout
        if: needs.package-matrix.outputs.mutate-scope == 'all' || needs.package-matrix.outputs.mutate-classes != '[]'
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        if: needs.package-matrix.outputs.mutate-scope == 'all' || needs.package-matrix.outputs.mutate-classes != '[]'
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          # pest --mutate needs a coverage driver.
          coverage: pcov
          extensions: intl, openssl, pdo_sqlite
          tools: composer:v2

      - name: Install dependencies
        if: needs.package-matrix.outputs.mutate-scope == 'all' || needs.package-matrix.outputs.mutate-classes != '[]'
        run: composer install --no-interaction --prefer-dist

      - name: Pest mutate per class
        if: needs.package-matrix.outputs.mutate-scope == 'all' || needs.package-matrix.outputs.mutate-classes != '[]'
        env:
          MUTATE_SCOPE: ${{ needs.package-matrix.outputs.mutate-scope }}
          MUTATE_CLASSES: ${{ needs.package-matrix.outputs.mutate-classes }}
          MUTATE_SHARD: ${{ matrix.shard }}
          MUTATE_SHARDS: 9
        run: bash scripts/mutate-per-class.sh

  # One stable check name over every shard, for branch protection: it fails
  # unless every shard succeeded (a cancelled or skipped shard fails it too).
  mutation:
    name: Mutation (per-class ≥95%)
    needs: mutation-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SHARDS_RESULT: ${{ needs.mutation-shards.result }}
        run: test "$SHARDS_RESULT" = success

  # Real HTTP against php -S (the Pest `http` group).
  http-server:
    name: Real HTTP (Laravel ${{ matrix.laravel }})
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
    steps:
      - name: Checkout
        if: needs.package-matrix.outputs.docs-only != 'true'
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        if: needs.package-matrix.outputs.docs-only != 'true'
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          extensions: intl, openssl, pdo_sqlite
          tools: composer:v2

      - name: Install dependencies
        if: needs.package-matrix.outputs.docs-only != 'true'
        env:
          LARAVEL_MAJOR: ${{ matrix.laravel }}
          TESTBENCH_MAJOR: ${{ matrix.testbench }}
        run: |
          if [ "${LARAVEL_MAJOR}" = "12" ]; then
            ILLUMINATE='^12.41.1'
          else
            ILLUMINATE='^13.0'
          fi
          composer require --dev --no-interaction --no-update "orchestra/testbench:^${TESTBENCH_MAJOR}.0"
          composer require --no-interaction --no-update \
            "illuminate/console:${ILLUMINATE}" \
            "illuminate/contracts:${ILLUMINATE}" \
            "illuminate/database:${ILLUMINATE}" \
            "illuminate/http:${ILLUMINATE}" \
            "illuminate/routing:${ILLUMINATE}" \
            "illuminate/support:${ILLUMINATE}"
          composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pest (real HTTP group)
        if: needs.package-matrix.outputs.docs-only != 'true'
        run: |
          count="$(vendor/bin/pest --list-tests --group=http 2>/dev/null | grep -c . || true)"
          if [ "${count}" -eq 0 ]; then
            echo "The http Pest group is empty."
            exit 1
          fi
          vendor/bin/pest --group=http

  # The whole suite and the erasure conformance runner on each server engine
  # of the shared matrix (design §11.3): token, refresh, revocation and consent
  # queries differ by dialect (MySQL refuses an UPDATE whose subquery reads the
  # same table, error 1093). SQLite runs in the test matrix and the erasure job.
  databases:
    name: Pest on ${{ matrix.database.name }}
    needs: package-matrix
    runs-on: ubuntu-latest
    # The whole suite on a server engine: MariaDB took over 10 minutes locally.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJSON(needs.package-matrix.outputs.databases) }}
    services:
      database:
        # An empty image starts no container on a pull request that does not need it.
        image: ${{ needs.package-matrix.outputs.run-databases == 'true' && matrix.database.image || '' }}
        env: ${{ matrix.database.environment }}
        ports:
          - ${{ matrix.database.port }}:${{ matrix.database.port }}
        options: ${{ matrix.database.options }}
    env:
      DB_CONNECTION: ${{ matrix.database.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.database.port }}
      DB_DATABASE: qiick_package
      DB_USERNAME: ${{ matrix.database.username }}
      DB_PASSWORD: ${{ matrix.database.password }}
    steps:
      - name: Checkout
        if: needs.package-matrix.outputs.run-databases == 'true'
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        if: needs.package-matrix.outputs.run-databases == 'true'
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          extensions: intl, openssl, pdo_sqlite, pdo_mysql, pdo_pgsql
          tools: composer:v2

      - name: Install dependencies
        if: needs.package-matrix.outputs.run-databases == 'true'
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^11.0"
          composer require --no-interaction --no-update \
            "illuminate/console:^13.0" \
            "illuminate/contracts:^13.0" \
            "illuminate/database:^13.0" \
            "illuminate/http:^13.0" \
            "illuminate/routing:^13.0" \
            "illuminate/support:^13.0"
          composer update --no-interaction --prefer-dist --with-all-dependencies

      # Check the migrated package schema before the real HTTP tests add the
      # test product's grant table to this database.
      - run: node tests/Erasure/run.mjs
        name: Erasure conformance
        if: needs.package-matrix.outputs.run-databases == 'true'

      - name: Pest
        if: needs.package-matrix.outputs.run-databases == 'true'
        run: vendor/bin/pest

  # Always in full, also on a docs-only pull request: the standards check
  # requires one unconditional run of the erasure suite, and it takes a minute.
  erasure:
    name: Erasure (E1–E14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          extensions: intl, openssl, pdo_sqlite
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - run: node tests/Erasure/run.mjs
        name: Erasure conformance

  # S81: installing without Inertia (suggest) boots; --no-dev proves that.
  no-dev-boot:
    name: No-dev boot (no Inertia)
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        if: needs.package-matrix.outputs.docs-only != 'true'
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        if: needs.package-matrix.outputs.docs-only != 'true'
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          extensions: intl, openssl
          tools: composer:v2

      - name: Install runtime dependencies only
        if: needs.package-matrix.outputs.docs-only != 'true'
        run: |
          composer update --no-interaction --prefer-dist --no-dev
          php -r 'require "vendor/autoload.php"; echo class_exists("Qiick\\McpOAuth\\McpOAuthServiceProvider") ? "ok\n" : exit(1);'

  standards:
    # qiick-io/app-ui@v0.15.0
    uses: qiick-io/app-ui/.github/workflows/drift-check.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0
    with:
      standards: true
      registry: false

  pr-title:
    if: github.event_name == 'pull_request'
    # qiick-io/app-ui@v0.15.0
    uses: qiick-io/app-ui/.github/workflows/pr-title.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0

  # A failed nightly run opens an issue, so nobody has to watch it.
  nightly-failure:
    needs: [package-matrix, tests, mutation, http-server, databases, erasure, no-dev-boot, standards]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue for the failing run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Nightly CI failed on $(date -u +%F)" \
            --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --label bug
